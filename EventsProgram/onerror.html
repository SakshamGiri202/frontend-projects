<!DOCTYPE html>
<html lang="en">

<body onerror="myfunction()">

    <img id="puppyImage" src="https://images.unsplash.com/photo-1507146426996-ef05306b995a?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8cHVwcHl8ZW58MHx8MHx8fDA%3D" alt="Golden Retriever puppy">

    <br><br>

    <button id="btn">Remove Image Source</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const image = document.getElementById('puppyImage');
            const btn = document.getElementById('btn');

            image.addEventListener('error', () => {
                console.error('Failed to load image.');
                alert('Error loading image!');
            });


            btn.addEventListener('click', () => {
                image.removeAttribute('src');

                image.style.display = 'none';
            });

            function myfunction() {
                alert("there is the error in the image path");
            }
        });
    </script>
</body>

</html>
