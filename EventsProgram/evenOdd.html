<!DOCTYPE html>

<h1>check if the number is odd or even</h1>

<body>

    <Script>
        let input = prompt("Enter any number:");

        function isOddOrEven(val) {


            if (val % 2 === 0) {
                alert("Yes, it is a even");
            } else {
                alert("No, it is an odd");
            }
        }

        isOddOrEven(input);
    </Script>
</body>

</html>
