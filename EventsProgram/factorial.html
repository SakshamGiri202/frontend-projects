<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

</head>
<h1>find the factorial of the given number</h1>

<body>

    <Script>
        let input = prompt("Enter any number:");

        function fact(val) {
            let temp = 1;
            while (val > 0) {
                temp *= (val--);
            }
            alert("factorial of the given number is:" + temp);
        }

        fact(input);
    </Script>
</body>

</html>
